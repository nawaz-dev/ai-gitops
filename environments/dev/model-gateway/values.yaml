
replicaCount: 1
image:
  repository: docker.io/nawaz343/model-gateway
  tag: "aa7113445209f4ce82c777561e02e40bf97c5a9e"
  pullPolicy: IfNotPresent
gateway:
  port: 5000
  redisAddr: host.k3d.internal:6379
  rateLimitRPM: 60
  existingSecret: model-gateway-secrets
  modelConfigMountPath: /app/configs/models.json
models:
  - model_id: qwen-small
    provider: vllm
    base_url: http://vllm.llm-serving.svc.cluster.local:8000
    provider_model_id: qwen-small
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
