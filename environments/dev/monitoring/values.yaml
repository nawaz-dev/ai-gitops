prometheus:
  enabled: true

  image:
    repository: quay.io/prometheus/prometheus
    tag: latest
    pullPolicy: IfNotPresent

  service:
    port: 9090

  scrape:
    interval: 15s
    target: vllm.llm-serving.svc.cluster.local:8000

  retention: 15d

  persistence:
    enabled: true
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 20Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

grafana:
  enabled: true

  image:
    repository: grafana/grafana
    tag: "12.2.0"
    pullPolicy: IfNotPresent

  service:
    port: 3000

  datasource:
    url: http://monitoring-prometheus:9090

  admin:
    existingSecret: grafana-admin

  persistence:
    enabled: true
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi