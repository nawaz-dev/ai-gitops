
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-gateway-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/nawaz-dev/ai-platform-engineering.git
      targetRevision: main
      path: helm/model-gateway
      helm:
        releaseName: model-gateway
        valueFiles:
          - $values/environments/dev/model-gateway/values.yaml
    - repoURL: https://github.com/nawaz-dev/ai-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://k3d-fde-gpu-v2-serverlb:6443
    namespace: llm-serving
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
image:
  repository: docker.io/nawaz343/model-gateway
  tag: c5c8c045fbe8c4b3cdd2f7f5c1de73bd14f66286
