apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-dev
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://github.com/nawaz-dev/ai-platform-engineering.git
      targetRevision: bd420f7fb266f9b14dc835df3273d33cbabeb8ab
      path: helm/vllm
      helm:
        releaseName: vllm
        valueFiles:
          - $values/environments/dev/vllm/values.yaml

    - repoURL: https://github.com/nawaz-dev/ai-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://k3d-fde-gpu-v2-serverlb:6443
    namespace: llm-serving

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
