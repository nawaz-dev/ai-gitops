
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-platform-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nawaz-dev/ai-gitops.git
    targetRevision: main
    path: argocd/applications
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
